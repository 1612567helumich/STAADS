<title>Conexiones Villahermosa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen workspace. 3D stage on the left, review panel on the right; stacks on phones. */
:root{
  --bg:#e5e9ec;
  --surface:#f3f5f6;
  --surface-2:#ffffff;
  --ink:#19222a;
  --muted:#53626d;
  --line:#c6cfd5;
  --line-strong:#97a5ae;
  --accent:#c4561a;
  --accent-soft:#f5e1d3;
  --accent-ink:#ffffff;
  --ok:#2a7f51;
  --ok-soft:#dbeee2;
  --warn:#9b6b06;
  --warn-soft:#f5ead0;
  --crit:#b8342a;
  --crit-soft:#f6dbd7;
  --info:#2f6696;
  --info-soft:#dce7f2;
  --scene:#e1e6e9;
  --edge:#1b2329;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1417; --surface:#151c21; --surface-2:#1b242a; --ink:#e1e7eb; --muted:#93a1ab;
    --line:#29343c; --line-strong:#44525c; --accent:#ec8a46; --accent-soft:#3a2618; --accent-ink:#1b0f06;
    --ok:#5ab985; --ok-soft:#163223; --warn:#e0ab45; --warn-soft:#352a10; --crit:#ef6f61; --crit-soft:#3c1b17;
    --info:#7cafe0; --info-soft:#15293b; --scene:#11181d; --edge:#06090b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1417; --surface:#151c21; --surface-2:#1b242a; --ink:#e1e7eb; --muted:#93a1ab;
  --line:#29343c; --line-strong:#44525c; --accent:#ec8a46; --accent-soft:#3a2618; --accent-ink:#1b0f06;
  --ok:#5ab985; --ok-soft:#163223; --warn:#e0ab45; --warn-soft:#352a10; --crit:#ef6f61; --crit-soft:#3c1b17;
  --info:#7cafe0; --info-soft:#15293b; --scene:#11181d; --edge:#06090b; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

/* ---------- top bar ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{margin:0;font:700 1.55rem/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.brand p{margin:3px 0 0;color:var(--muted);font:400 .78rem/1.3 var(--f-mono)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:6px 11px;font:600 .82rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface-2)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink);background:var(--surface)}
.seg-label{font:600 .72rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.ctl{display:flex;align-items:center}

/* ---------- work area ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:12px;min-height:0}
.stage{position:relative;min-height:0;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--scene);touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none;z-index:1}
.labels > div{pointer-events:none}
.tag{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 6px 2px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-strong);border-left:4px solid var(--ok);box-shadow:0 1px 2px rgb(0 0 0 / .12);white-space:nowrap;transform:translateY(-6px)}
.tag b{font:700 .86rem/1 var(--f-display);letter-spacing:.04em}
.tag small{font:500 .64rem/1 var(--f-mono);color:var(--muted)}
.tag.warn{border-left-color:var(--warn)} .tag.crit{border-left-color:var(--crit)} .tag.none{border-left-color:var(--line-strong);opacity:.85}
.tag.sel{outline:2px solid var(--accent);outline-offset:1px}
.bubble{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink);background:var(--surface-2);font:700 .9rem/1 var(--f-display)}
.axis-tag{font:600 .74rem/1 var(--f-mono);color:var(--muted);background:var(--surface-2);padding:2px 4px;border-radius:3px;border:1px solid var(--line)}
.mk{pointer-events:auto;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 .8rem/1 var(--f-display);color:#fff;background:var(--crit);border:2px solid var(--surface-2);box-shadow:0 1px 3px rgb(0 0 0 / .3)}
.mk.warn{background:var(--warn)} .mk.info{background:var(--info)}
.mk:hover{transform:scale(1.15)}
.tooltip{position:absolute;z-index:5;pointer-events:none;max-width:290px;padding:7px 9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-strong);box-shadow:0 4px 14px rgb(0 0 0 / .18);font-size:.8rem;line-height:1.35}
.tooltip b{font:600 .95rem/1.1 var(--f-display);letter-spacing:.02em}
.tooltip .mono{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.tooltip.pinned{pointer-events:auto}
.legend{position:absolute;left:10px;bottom:10px;z-index:4;max-width:min(360px,calc(100% - 20px));background:color-mix(in srgb,var(--surface-2) 92%,transparent);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:.7rem;line-height:1.2}
.legend summary{cursor:pointer;font:600 .74rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);list-style:none}
.legend summary::-webkit-details-marker{display:none}
.legend ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.legend li{display:flex;align-items:center;gap:6px;min-width:0}
.sw{display:inline-block;vertical-align:middle;width:11px;height:11px;border-radius:2px;flex:none;border:1px solid rgb(0 0 0 / .25)}
@media (max-width: 600px){ .tag{padding:2px 4px 1px} .tag b{font-size:.74rem} .tag small{display:none} .bubble{width:20px;height:20px;font-size:.75rem} .hint{display:none} }
.hint{position:absolute;right:10px;top:10px;z-index:4;font:400 .72rem/1.3 var(--f-mono);color:var(--muted);background:color-mix(in srgb,var(--surface-2) 85%,transparent);padding:4px 7px;border-radius:4px}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:600 1rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- panel ---------- */
.panel{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line-strong);background:var(--surface-2)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 8px;cursor:pointer;font:600 .86rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{display:inline-block;min-width:1.4em;margin-left:4px;padding:1px 4px;border-radius:9px;background:var(--crit);color:#fff;font:600 .7rem/1.2 var(--f-mono)}
.tabpanel{flex:1;min-height:0;overflow:auto;padding:12px 12px 18px;display:flex;flex-direction:column;gap:12px}
h2{margin:0;font:700 1.15rem/1.1 var(--f-display);letter-spacing:.02em;text-wrap:balance}
h3{margin:0;font:600 .78rem/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:.8rem}
.note{font-size:.8rem;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:5px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start}
.note p{flex:1;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:5px;padding:5px 9px;cursor:pointer;font:600 .78rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 7px;font-size:.72rem}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.plan{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:4px}
.plan svg{display:block;width:100%;height:auto}
.plan .gl{stroke:var(--line-strong);stroke-width:2;stroke-dasharray:14 8}
.plan .bm{stroke:var(--info);stroke-width:5;opacity:.45}
.plan .bmc{stroke:var(--muted);stroke-width:3;opacity:.35}
.plan .fac{stroke:var(--muted);stroke-width:3;stroke-dasharray:6 6;opacity:.6;fill:none}
.plan text{fill:var(--ink);font-family:var(--f-display);paint-order:stroke;stroke:var(--surface-2);stroke-width:9px;stroke-linejoin:round}
.plan .bub circle{fill:var(--surface-2);stroke:var(--ink);stroke-width:3}
.plan .bub text{font-weight:700;font-size:40px;text-anchor:middle;dominant-baseline:central}
.plan .dim{fill:var(--muted);font-family:var(--f-mono);font-size:30px;text-anchor:middle}
.plan .col{cursor:pointer}
.plan .col rect{stroke:var(--ink);stroke-width:3}
.plan .col.ok rect{fill:var(--ok)} .plan .col.warn rect{fill:var(--warn)} .plan .col.crit rect{fill:var(--crit)} .plan .col.none rect{fill:var(--surface-2);stroke-dasharray:6 4}
.plan .col.sel .ring{stroke:var(--accent);stroke-width:8;fill:none}
.plan .col text{font-size:34px;font-weight:700;text-anchor:middle}
.plan .col .pid{font-family:var(--f-mono);font-size:24px;font-weight:400;fill:var(--muted)}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card-head h2{margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:10px;font:600 .72rem/1.3 var(--f-display);letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.chip.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.chip.neutral{background:var(--surface);color:var(--muted);border-color:var(--line)}
label.sel-mark{display:flex;align-items:center;gap:6px;font:600 .74rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select{border:1px solid var(--line-strong);border-radius:5px;background:var(--surface-2);padding:4px 6px;font:600 .9rem/1.1 var(--f-display);letter-spacing:.03em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:.8rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:.76rem;min-width:0;overflow-wrap:anywhere}
.lvl{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.lvl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.lvl-head h3{color:var(--ink);font-size:.86rem;margin-right:auto}
.lvl-head .mono{font-size:.7rem;color:var(--muted)}
.conn{display:flex;flex-direction:column;gap:6px}
.cr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 8px;align-items:start;padding:7px 8px;border-radius:5px;background:var(--surface);border-left:4px solid var(--ok)}
.cr.warn{border-left-color:var(--warn)} .cr.crit{border-left-color:var(--crit)} .cr.info{border-left-color:var(--info)}
.dirb{display:flex;flex-direction:column;align-items:center;gap:1px}
.dirb b{font:700 1rem/1 var(--f-display)}
.dirb span{font:500 .66rem/1 var(--f-mono);color:var(--muted)}
.cr .main{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:.8rem}
.cr .main .mono{font-size:.72rem;color:var(--muted)}
.cr .plates{font-size:.76rem}
.cr .why{font-size:.76rem;color:var(--ink)}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:180px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.bar.hi i{background:var(--warn)} .bar.over i{background:var(--crit)}
.memb{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.item{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 2px;border:1px solid currentColor;border-radius:50%;font:500 .7rem/1 var(--f-mono)}
table{border-collapse:collapse;width:100%;font-size:.78rem}
th{font:600 .7rem/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 5px;border-bottom:1px solid var(--line-strong)}
td{padding:4px 5px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs button{border:1px solid var(--line);border-radius:4px;background:#fff;padding:0;cursor:zoom-in;overflow:hidden;aspect-ratio:11/17;max-width:100%}
.thumbs img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.thumbs figcaption{font:500 .66rem/1.2 var(--f-mono);color:var(--muted);text-align:center;margin-top:2px}
.parts tr{cursor:pointer}
.parts tr:hover td{background:var(--surface)}
.parts tr.on td{background:var(--accent-soft)}
.find{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--info)}
.find.crit{border-left-color:var(--crit)} .find.warn{border-left-color:var(--warn)}
.find.hl{box-shadow:0 0 0 2px var(--accent)}
.find h4{margin:0;font:600 1rem/1.15 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.find p,.find li{font-size:.8rem}
.find ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
pre.code{margin:0;padding:8px 10px;border-radius:5px;background:var(--surface);border:1px solid var(--line);font:400 .72rem/1.45 var(--f-mono);white-space:pre;overflow-x:auto;max-height:220px}
.layers{display:flex;flex-direction:column;gap:2px}
.layers label{display:flex;align-items:center;gap:9px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:.86rem;cursor:pointer}
.layers label .sw{width:14px;height:4px;border:0;border-radius:2px}
.layers small{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.layers input{accent-color:var(--accent);width:16px;height:16px}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:50;background:rgb(10 14 17 / .82);display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:8px;color:#e8edf0}
.lb-bar strong{font:700 1.05rem/1.1 var(--f-display);letter-spacing:.03em;margin-right:auto;min-width:0}
.lb-bar .btn{background:#1d262c;color:#e8edf0;border-color:#4a5862}
.lb-view{flex:1;min-height:0;overflow:auto;background:#f4f4f2;border-radius:4px;cursor:grab;touch-action:pan-x pan-y}
.lb-view.drag{cursor:grabbing}
.lb-view img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}

/* ---------- inspector de pieza ---------- */
.insp{position:absolute;left:10px;top:10px;z-index:6;width:min(360px,calc(100% - 20px));max-height:calc(100% - 20px);display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 10px 30px rgb(0 0 0 / .22);overflow:hidden}
.insp-head{display:flex;align-items:flex-start;gap:9px;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.insp-head .sw{width:16px;height:16px;margin-top:3px}
.insp-head .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.insp-head b{font:700 1.12rem/1.05 var(--f-display);letter-spacing:.02em}
.insp-head small{font-size:.76rem;color:var(--muted);line-height:1.3}
.insp-x{border:0;background:transparent;font-size:1.35rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.insp-x:hover{color:var(--ink)}
.insp-nav{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line);font:500 .74rem/1.3 var(--f-mono)}
.insp-nav .grow{flex:1;min-width:0}
.insp-body{overflow:auto;padding:9px 10px 12px;display:flex;flex-direction:column;gap:11px}
.insp.collapsed .insp-body{display:none}
.insp-sec{display:flex;flex-direction:column;gap:4px}
.insp-sec h5{margin:0;font:600 .7rem/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.insp .kv{font-size:.76rem}
.insp .kv dd{font-size:.72rem}
.qc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;font-size:.76rem;align-items:baseline}
.qc .lbl{min-width:0}
.qc .val{font:500 .7rem/1.2 var(--f-mono);text-align:right;white-space:nowrap}
.qc .bar{grid-column:1 / -1;max-width:none;height:5px;margin:1px 0 5px}
.gov{font-size:.78rem;padding:6px 8px;border-radius:5px;font-weight:600}
.gov.ok{background:var(--ok-soft);color:var(--ok)} .gov.warn{background:var(--warn-soft);color:var(--warn)} .gov.crit{background:var(--crit-soft);color:var(--crit)} .gov.info{background:var(--info-soft);color:var(--info)}
.part-thumb{display:flex;gap:8px;align-items:flex-start}
.part-thumb button.th{flex:none;width:104px;aspect-ratio:11/8.5;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0;cursor:zoom-in;overflow:hidden}
.part-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.nbl{display:flex;flex-direction:column;gap:3px}
.nbb{display:flex;align-items:center;gap:7px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:4px 6px;cursor:pointer;font-size:.76rem}
.nbb:hover{border-color:var(--ink)}
.nbb.on{border-color:var(--accent);background:var(--accent-soft)}
.nbb .sw{width:10px;height:10px}
.dimtag{font:600 .68rem/1 var(--f-mono);color:var(--ink);background:color-mix(in srgb,var(--surface-2) 90%,transparent);border:1px solid var(--line-strong);border-radius:3px;padding:2px 4px;white-space:nowrap}
.ib{pointer-events:auto;cursor:pointer;min-width:22px;height:22px;padding:0 5px;border-radius:11px;display:grid;place-items:center;border:1.5px solid var(--ink);background:var(--surface-2);font:600 .74rem/1 var(--f-mono);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.ib:hover{transform:scale(1.12)}
.ib.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage.focusing .tag:not(.sel){opacity:.25}
.stage.focusing .bubble,.stage.focusing .mk{opacity:.2}
.stage.focusing .axis-tag{display:none}
.stage.focusing .hint{display:none}
.cr .act{grid-column:2 / 4}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--surface)}

const D = JSON.parse(document.getElementById('staad-data').textContent);

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const adj = new Map();
for (const [id, m] of Object.entries(MEM)) for (const n of [m[0], m[1]]) {
  if (!adj.has(n)) adj.set(n, []);
  adj.get(n).push(+id);
}
const nodeKey = (x, y, z) => `${Math.round(x)}|${Math.round(y)}|${Math.round(z)}`;
const nodeIndex = new Map();
for (const [id, p] of Object.entries(J)) nodeIndex.set(nodeKey(p[0], p[1], p[2]), +id);

function memberDir(mid, n) {
  const m = MEM[mid]; const other = m[0] === n ? m[1] : m[0];
  const a = J[n], b = J[other];
  const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
  const L = Math.hypot(dx, dy, dz), h = Math.hypot(dx, dz);
  let dir = 'diag';
  if (Math.abs(dy) > 0.95 * L) dir = dy > 0 ? '+Y' : '-Y';
  else if (Math.abs(dy) < 0.02 * L && Math.abs(dx) > 0.995 * h) dir = dx > 0 ? '+X' : '-X';
  else if (Math.abs(dy) < 0.02 * L && Math.abs(dz) > 0.995 * h) dir = dz > 0 ? '+Z' : '-Z';
  return { mid, other, dir, L, atStart: m[0] === n, vec: [dx / L, dy / L, dz / L] };
}
const around = n => (n ? (adj.get(n) || []).map(mid => memberDir(mid, n)) : []);

  p.nMez = nodeIndex.get(nodeKey(x, 327, z));
  p.nCub = nodeIndex.get(nodeKey(x, 604, z));
  const horiz = d => /^[+-][XZ]$/.test(d.dir) && grpName(d.mid) !== '_COLUMNAS';
  p.beams = { mez: around(p.nMez).filter(horiz), cub: around(p.nCub).filter(horiz) };
  p.truss = around(p.nCub).filter(d => grpName(d.mid) === '_ARMADURAS');
  p.fij = [...around(p.nMez), ...around(p.nCub)].filter(d => d.dir === 'diag' && /D-14/.test(secName(d.mid)));

  p.faces = [];
  for (const d of p.facLinks) {
    if (Math.abs(d.vec[0]) > 0.3) p.faces.push(d.vec[0] > 0 ? '+X' : '-X');
    if (Math.abs(d.vec[2]) > 0.3) p.faces.push(d.vec[2] > 0 ? '+Z' : '-Z');
  }
  p.colBase = around(p.nBase).find(d => grpName(d.mid) === '_COLUMNAS');
  p.colAbove = around(p.nMez).find(d => grpName(d.mid) === '_COLUMNAS' && d.dir === '+Y');

  p.tipo = p.faces.length >= 2 ? 'esquina' : p.faces.length === 1 ? 'borde' : 'interior';
  POS.push(p);
}

function facFacesLocal(mk) { return mk.fac ? (mk.fac.kind === 'L' ? ['W', 'S'] : ['W']) : []; }
function bestK(p, mk) {
  let best = 0, bestScore = -Infinity;
  for (let k = 0; k < 4; k++) {
    const m = L2G[k]; let s = 0;
    for (const [lvl, w] of [['mez', 3], ['cub', 1]]) {
      const c = mk[lvl]; if (!c) continue;

      for (const d of pd) s += sd.has(d) ? 2 * w : -w;
      for (const d of sd) if (!pd.includes(d)) s -= w;
    }
    const mf = facFacesLocal(mk).map(d => m[d]);
    for (const f of mf) s += p.faces.includes(f) ? 2 : -1;
    for (const f of p.faces) if (!mf.includes(f)) s -= 1;
    if (s > bestScore) { bestScore = s; best = k; }
  }
  return best;
}

function analyze(p, markId) {
  const mk = markId ? MARKS[markId] : null;
  const A = { k: 0, rows: { cub: [], mez: [] }, fac: [], issues: [], status: 'ok' };
  const issue = (sev, code, t, extra = {}) => A.issues.push({ sev, code, t, pos: p.id, ...extra });
  if (!mk) {
    issue('warn', 'sinplano', 'Sin marca asignada: no hay plano de taller para esta columna.');
  } else {
    A.k = bestK(p, mk);
  }
  const m = L2G[A.k];
  for (const lvl of ['cub', 'mez']) {
    const c = mk ? mk[lvl] : null;
    const plateDirs = c ? c.dirs.map(d => m[d]) : [];
    for (const g of ['+X', '+Z', '-X', '-Z']) {
      const sm = p.beams[lvl].filter(d => d.dir === g);
      const has = plateDirs.includes(g);
      if (!sm.length && !has) continue;
      const local = Object.keys(m).find(kk => m[kk] === g);
      let st = 'ok', why = '';
      if (sm.length && !has) {
        const rigid = sm.some(d => !/MZ/.test(relAt(d)));
        if (!mk) { st = 'warn'; why = 'Sin plano para esta columna.'; }
        else if (lvl === 'cub' && !c) { st = 'crit'; why = `La columna ${markId} termina en el mezzanine; en STAAD esta viga llega a la columna a ${nf(STAAD_MM.cub / 1000)} m.`; }
        else { st = rigid ? 'crit' : 'warn'; why = rigid ? 'Viga empotrada en STAAD (sin liberaciones) y el plano no tiene placas en esta cara.' : 'Viga articulada en STAAD; el plano no tiene conexión en esta cara.'; }
        if (mk) issue(st, lvl === 'cub' && !c ? 'corta' : 'sinplacas', why, { lvl, dir: g, members: sm.map(d => d.mid) });
      } else if (!sm.length && has) {
        st = 'warn'; why = 'Hay placas en el plano pero STAAD no tiene viga en esta dirección.';
        issue('warn', 'sinviga', why, { lvl, dir: g });
      } else {
        const sec = secName(sm[0].mid), dep = DEPTH_MM[sec];
        if (dep && Math.abs(c.clear - dep) > 12) {
          st = 'crit'; why = `Peralte ${sec} = ${nf(dep, 1)} mm, pero las placas quedan a ${nf(c.clear, 1)} mm libres (diseñadas para peralte 10″).`;
          issue('crit', 'peralte', why, { lvl, dir: g, members: sm.map(d => d.mid) });
        }
        const ck0 = CHK[sm[0].mid], q0 = QSPEC[c.flange];
        if (st === 'ok' && q0 && atNodeOf(sm[0], ck0)) {
          const Ff = flangeForce(sm[0], ck0, q0.tp), phi = hssK17(q0.Wf, q0.tp);
          if (Ff > phi) { st = 'crit'; why = `Pared del HSS (K1-7): fuerza de patín ${nf(Ff / 1000, 2)} t > φRn ${nf(phi / 1000, 2)} t (relación ${nf(Ff / phi, 2)}).`; issue('crit', 'hss', why, { lvl, dir: g, members: sm.map(d => d.mid) }); }
        }
        const r = Math.max(...sm.map(d => (CHK[d.mid] || [0, 0])[1]));
        if (st === 'ok' && r >= 0.8) { st = 'warn'; why = `Relación de diseño alta en la viga (${nf(r)}): revisar la conexión con prioridad.`; issue('warn', 'demanda', why, { lvl, dir: g, members: sm.map(d => d.mid) }); }
      }
      A.rows[lvl].push({ g, local, sm, has, st, why });
    }
  }
  // Fachada (enlace W16X36 a nivel 20 cm en STAAD)
  if (mk || p.faces.length) {
    const mf = mk ? facFacesLocal(mk).map(d => m[d]) : [];
    for (const f of new Set([...mf, ...p.faces])) {
      const s = p.faces.includes(f), pl = mf.includes(f);
      let st = 'ok', why = '';
      if (s && !pl) { st = 'warn'; why = 'STAAD tiene viga de apoyo de fachada (MCC8-14) en esta cara y el plano no tiene placas.'; if (mk) issue('warn', 'fachada', why, { lvl: 'fac', dir: f }); }
      if (!s && pl) { st = 'warn'; why = 'Placas de fachada sin viga de apoyo en STAAD en esta cara.'; issue('warn', 'fachada', why, { lvl: 'fac', dir: f }); }
      A.fac.push({ f, s, pl, st, why, link: p.facLinks.find(d => (Math.abs(d.vec[0]) > .3 && (d.vec[0] > 0 ? '+X' : '-X') === f) || (Math.abs(d.vec[2]) > .3 && (d.vec[2] > 0 ? '+Z' : '-Z') === f)) });
    }
  }
  if (mk && mk.L < 5000 && p.colAbove) {
    issue('crit', 'corta', `${markId} mide ${nf(mk.L + 15.9 + 6.4, 1)} mm y lleva tapa ciega; en STAAD la columna sigue hasta cubierta (barra ${p.colAbove.mid}, ${secName(p.colAbove.mid)}).`, { lvl: 'cub', members: [p.colAbove.mid] });
  }
  if (mk && mk.n412) issue('info', 'n412', 'Placas a 412.7 mm (piezas 6, 7 y 8) sin elemento correspondiente en STAAD; orientación en planta no definida en el plano.', { lvl: 'fac' });
  A.status = A.issues.some(i => i.sev === 'crit') ? 'crit' : A.issues.some(i => i.sev === 'warn') ? 'warn' : 'ok';
  if (!mk) A.status = 'none';
  return A;
}

function compact(ids) {
  const s = [...new Set(ids)].sort((a, b) => a - b); const out = [];
  for (let i = 0; i < s.length;) { let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; out.push(j - i >= 2 ? `${s[i]} TO ${s[j]}` : s.slice(i, j + 1).join(' ')); i = j + 1; }
  return out.join(' ');
}

}

  if (corta.length) F.push({ sev: 'crit', code: 'corta', t: 'Columnas interiores cortadas en el mezzanine',

  F.push({ sev: 'warn', code: 'elev', t: 'Elevaciones de conexión distintas al modelo',

    b: `<p>Las placas traen barrenos Ø14.29 mm (9/16″) y oblongos 9/16″×1″, pero ninguna hoja indica diámetro, grado (A307/A325) ni número de tornillos por conexión. Las soldaduras sí vienen (ER70S-6, filetes de 3 y 5 mm). Sin la tornillería no se puede revisar la capacidad de las conexiones a momento.</p>` });

  const baseRows = POS.map(p => { const d = p.colBase, c = d && CHK[d.mid]; return c && c[3] < 0.5 ? `<tr><td>${p.id}</td><td>${esc(state.assign[p.id] || '—')}</td><td class="n">${tt(c[5])}</td><td class="n">${tm(c[10])}</td><td class="n">${tm(c[9])}</td><td class="n">${c[2]}</td></tr>` : ''; }).join('');
  F.push({ sev: 'info', code: 'base', t: 'Bases empotradas en STAAD',
    b: `<p>Los 12 apoyos son FIXED, así que las placas base trabajan con momento. SYR-01, 02, 03, 06 y 07 usan placa de 300×300×5/8″ con 8 anclas; SYR-04 y SYR-05 usan la T-02 con solo 4 anclas. Fuerzas en la base de cada columna para la combinación que rige su revisión (P en t, negativo = compresión; M en t·m):</p><div class="tbl"><table><thead><tr><th>Eje</th><th>Marca</th><th class="n">P</th><th class="n">Mx</th><th class="n">My</th><th class="n">LC</th></tr></thead><tbody>${baseRows}</tbody></table></div><p>Son las fuerzas del CHECK CODE de cada columna, no la envolvente: para diseñar anclas usa las reacciones (comando abajo).</p>` });

  F.push({ sev: 'info', code: 'fij', t: 'Fijaciones de fachada en esquinas (D-14)',

  const fails = Object.entries(CHK).filter(([, c]) => c[0] !== 'P');
  const top = id => fails.filter(([m]) => secName(m) === id).reduce((mx, [, c]) => Math.max(mx, c[1]), 0);
  if (fails.length) F.push({ sev: 'info', code: 'ratio', t: `El .ANL tiene ${fails.length} barras que no pasan`,

  const mids = new Set();
  for (const p of POS) for (const n of [p.nFac, p.nMez, p.nCub]) if (n) for (const d of around(n)) mids.add(d.mid);
  const sup = POS.map(p => p.nBase);
  const cmd = `* Fuerzas en extremos de barras que llegan a columnas\nLOAD LIST 30 TO 47\n${wrapStaad('PRINT MEMBER FORCES LIST', compact([...mids]))}\n${wrapStaad('PRINT SUPPORT REACTION LIST', compact(sup))}`;
  F.push({ sev: 'info', code: 'fuerzas', t: 'Fuerzas para diseñar las conexiones',
    b: `<p>El CHECK CODE del .ANL solo da las fuerzas en la sección crítica de cada barra. Para revisar placas, tornillos y soldaduras necesitas fuerzas en los extremos. Agrega esto al .STD después de PERFORM ANALYSIS y vuelve a correr:</p><pre class="code" id="cmd">${esc(cmd)}</pre><div class="row"><button type="button" class="btn sm" data-act="copy">Copiar comandos</button><span class="small muted" id="copy-msg" aria-live="polite"></span></div>` });
  return F;
}

function setTab(t) {

  for (const [id, key] of [['col', 'col'], ['pie', 'pie'], ['rev', 'rev'], ['cap', 'cap']]) {
    $(`#t-${id}`).setAttribute('aria-selected', String(key === t)); $(`#p-${id}`).hidden = key !== t;

}
$('.tabs').addEventListener('click', ev => { const b = ev.target.closest('[role=tab]'); if (b) setTab(b.id.slice(2)); });
$('#views').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) setView(b.dataset.view); });
$('#levels').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) setLevel(b.dataset.level); });
document.querySelector('.panel').addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'pos') selectPos(t.dataset.pos, { focus: true });
  else if (act === 'focus') focusPos(state.sel, t.dataset.lvl);
  else if (act === 'goto') { selectPos(t.dataset.pos, { focus: true, lvl: t.dataset.lvl || null }); }
  else if (act === 'reset') { state.assign = { ...DEFAULT_ASSIGN }; saveAssign(); rebuildAll(); }
  else if (act === 'plate') { const m = findPlate(state.sel, t.dataset.lvl, t.dataset.g); if (m) focusPlate(m); }
  else if (act === 'plate-at') { const m = findPlate(t.dataset.pos, t.dataset.lvl, t.dataset.g); if (m) focusPlate(m); }
  else if (act === 'plate-part') { const a = assemblies.get(state.sel); const m = a && a.meshes.find(x => x.userData.part === t.dataset.part && !x.userData.sub); if (m) focusPlate(m); }
  else if (act === 'part-focus') { const list = instancesOf(t.dataset.part); if (!list.length) return; focusPlate(list.find(x => x.userData.pos === state.sel) || list[0]); }
  else if (act === 'part') {
    exitFocus(); state.part = state.part === t.dataset.part ? null : t.dataset.part; updateHighlight(); renderPartsTab();
    if (state.part && camera.position.distanceTo(controls.target) < 9) setView('iso');
  }
  else if (act === 'part-clear') { state.part = null; updateHighlight(); renderPartsTab(); }
  else if (act === 'sheet') openSheet(+t.dataset.sheet);
  else if (act === 'member') {
    const mid = +t.dataset.mid; const [a, b] = MEM[mid]; const A = S(...J[a]), B = S(...J[b]);
    const mid3 = A.clone().add(B).multiplyScalar(0.5); const dir = camera.position.clone().sub(controls.target).normalize();
    flyTo(mid3.clone().add(dir.multiplyScalar(2.2)), mid3);
  } else if (act === 'copy') {
    const txt = $('#cmd').textContent; const msg = $('#copy-msg');
    const sel = () => { const r = document.createRange(); r.selectNodeContents($('#cmd')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'Texto seleccionado: cópialo con Ctrl+C.'; };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'Copiado.'; }, sel); } catch (e) { sel(); }
  }
});
document.querySelector('.panel').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const t = ev.target.closest('[data-act="pos"],[data-act="part-focus"],[data-act="plate-part"]'); if (!t) return;
  ev.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true }));
});
document.querySelector('.panel').addEventListener('change', ev => {
  if (ev.target.id === 'mark-select') { state.assign[state.sel] = ev.target.value || null; saveAssign(); rebuildPos(state.sel); }
  else if (ev.target.dataset.layer) { state.layers[ev.target.dataset.layer] = ev.target.checked; applyLayerVisibility(); updateBeams(); }
  else if (ev.target.id === 'align') { state.align = ev.target.checked; updateBeams(); }
});

    <div class="insp-nav"><button type="button" class="btn sm" data-act="insp-prev" aria-label="Anterior">‹</button><span class="grow">${idx + 1} de ${list.length} en el edificio · ${esc(u.mark)}${it != null ? ` · ítem <span class="item">${it}</span>` : ''}</span><button type="button" class="btn sm" data-act="insp-next" aria-label="Siguiente">›</button>${list.length > 1 ? '<button type="button" class="btn sm" data-act="insp-all">Todas</button>' : ''}<button type="button" class="btn sm" data-act="insp-toggle" aria-expanded="${!inspCollapsed}" aria-controls="insp-body">${inspCollapsed ? 'Detalles' : 'Ocultar'}</button></div>

      <section class="insp-sec"><h5>Dónde va</h5><dl class="kv">
        <dt>Columna</dt><dd>Eje ${p.id} · ${TIPOTXT[p.tipo].toLowerCase()} · ${esc(u.mark)}</dd>

        <dt>Medidas</dt><dd>${u.role === 'hss' ? `152.4 × 152.4 × 6.35 · L = ${mk.L}` : esc(DIM_TXT[u.part] || '')} mm</dd>
        ${FACE_W[u.part] ? `<dt>En el paño</dt><dd>${FACE_W[u.part]}</dd>` : ''}
        <dt>Espesor</dt><dd>${u.role === 'hss' ? '1/4″ (diseño 5.9 mm)' : `${nf(P.t, 1)} mm (${INCH[P.t] || ''})`}</dd>
        <dt>Material</dt><dd>${u.role === 'hss' ? 'no indicado en plano (STAAD: Fy 2,582 kg/cm²)' : u.part === 'S07605000096' ? 'lámina cal 12' : 'A-36 (plano de pieza)'}</dd>
        ${P.holes ? `<dt>Barrenos</dt><dd>${esc(P.holes)}</dd>` : ''}
        <dt>Peso</dt><dd>${kg != null ? `${nf(kg, 3)} kg (plano)` : '—'}${ck != null ? ` · ${nf(ck, 3)} kg con la forma modelada` : ''}</dd></dl></section>
      <section class="insp-sec"><h5>Soldadura según plano</h5><p class="small">${esc(WELD_TXT[weldKey(u)] || '—')}</p></section>
      <section class="insp-sec"><h5>Conecta con (STAAD)</h5>${connectsHtml(mesh)}</section>
      ${quickHtml(mesh)}
      <section class="insp-sec"><h5>Planos</h5><div class="part-thumb">${P.hoja ? `<button type="button" class="th" data-act="sheet" data-sheet="${P.hoja}" aria-label="Abrir plano de la pieza"><img src="planos/hoja-${String(P.hoja).padStart(2, '0')}.png" alt="Plano de ${esc(u.part)}" loading="lazy"></button>` : ''}
        <div class="row" style="flex-direction:column;align-items:flex-start">${P.hoja ? `<button type="button" class="btn sm" data-act="sheet" data-sheet="${P.hoja}">Pieza · p.${P.hoja}</button>` : ''}<button type="button" class="btn sm" data-act="sheet" data-sheet="${mk.hojas[0]}">Ensamble ${esc(u.mark)} · p.${mk.hojas[0]}</button><button type="button" class="btn sm" data-act="sheet" data-sheet="${mk.hojas[1]}">Soldaduras · p.${mk.hojas[1]}</button></div></div></section>

}
let inspCollapsed = window.matchMedia('(max-width: 600px)').matches;
insp.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return; ev.stopPropagation();
  const a = t.dataset.act;
  if (a === 'insp-close') exitFocus();
  else if (a === 'insp-toggle') { inspCollapsed = !inspCollapsed; renderInspector(); }
  else if (a === 'insp-prev') stepInstance(-1);
  else if (a === 'insp-next') stepInstance(1);
  else if (a === 'insp-all') { const part = focus.mesh.userData.part; exitFocus(); state.part = part; updateHighlight(); renderPartsTab(); setView('iso'); setTab('pie'); }
  else if (a === 'insp-nb') { const m = [...focus.nb].find(x => x.userData.part === t.dataset.part && !x.userData.sub); if (m) focusPlate(m); }
  else if (a === 'sheet') openSheet(+t.dataset.sheet);
  else if (a === 'member') { const mid = +t.dataset.mid; const [na, nb] = MEM[mid]; const c = S(...J[na]).add(S(...J[nb])).multiplyScalar(0.5); const dir = camera.position.clone().sub(controls.target).normalize(); flyTo(c.clone().add(dir.multiplyScalar(2.2)), c); }
});
function reanalyzeAll() {
  for (const p of POS) {
    ANA[p.id] = analyze(p, state.assign[p.id] || null);
    const lab = labelObjs.get(p.id); if (lab) lab.element.className = `tag ${ANA[p.id].status}${state.sel === p.id ? ' sel' : ''}`;
  }
  refreshMarkers(); renderColumnTab(); renderReviewTab(); markDirty();
}
insp.addEventListener('change', ev => { if (ev.target.id === 'hss-fy') { state.hss = ev.target.value; reanalyzeAll(); renderInspector(); } });
['pointerdown', 'wheel'].forEach(e => insp.addEventListener(e, ev => ev.stopPropagation()));
document.addEventListener('keydown', ev => {
  if (!lb.hidden) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName || '')) return;
  if (ev.key === 'Escape' && focus.mesh) exitFocus();
  else if (focus.mesh && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) { ev.preventDefault(); stepInstance(ev.key === 'ArrowRight' ? 1 : -1); }
});

/* =====================================================================
   16. Tema, tamaño y bucle de render
   ===================================================================== */
function applyTheme() {
  scene.background = new THREE.Color(cssVar('--scene') || '#e1e6e9');
  edgeMat.color.set(cssVar('--edge') || '#1b2329');
  markDirty();
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
function resize() {
  const r = stage.getBoundingClientRect(); const w = Math.max(10, r.width), h = Math.max(10, r.height);
  renderer.setSize(w, h, false); labelRenderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); markDirty();
}
new ResizeObserver(resize).observe(stage);
controls.addEventListener('change', markDirty);
function loop(now) {
  requestAnimationFrame(loop);
  if (tween) {
    const t = Math.min(1, (now - tween.start) / tween.ms); const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    camera.fov = tween.f0 + (tween.f1 - tween.f0) * e; camera.updateProjectionMatrix();
    if (t >= 1) tween = null; dirty = true;
  }
  processMove();
  if (focus.mesh) {
    const m = selMat(focus.mesh.userData.part);
    const k = now < focus.pulseUntil ? 0.3 + 0.55 * (0.5 + 0.5 * Math.cos((focus.pulseUntil - now) / 1800 * Math.PI * 6)) : 0.5;
    if (Math.abs(m.emissiveIntensity - k) > 0.005) { m.emissiveIntensity = k; dirty = true; }
  }
  if (controls.update()) dirty = true;
  if (dirty) { const near = camera.position.distanceTo(controls.target) < 6; if (near !== gridNear) { gridNear = near; for (const o of gridBubbles) o.visible = !near && state.layers.grid; } }
  if (dirty) {
    const dist = camera.position.distanceTo(controls.target);
    const nr = Math.min(1, Math.max(0.01, dist / 350)), fr = dist + 90;
    if (Math.abs(camera.near - nr) > 1e-4 || Math.abs(camera.far - fr) > 0.5) { camera.near = nr; camera.far = fr; camera.updateProjectionMatrix(); }
    renderer.render(scene, camera); labelRenderer.render(scene, camera); dirty = false;
  }
}

/* ---------- arranque ---------- */
applyTheme(); renderLegend();
if (window.matchMedia('(pointer: coarse)').matches) $('#hint').textContent = '1 dedo: girar · 2 dedos: zoom y mover · Toque: seleccionar';
resize();
const [p0, t0] = VIEWS.iso(); camera.position.copy(p0); controls.target.copy(t0);
if (stage.clientHeight < 640 || stage.clientWidth < 720) $('#legend').open = false;
rebuildAll(); updateBeams(); applyLayerVisibility();
$('#loading').remove();
requestAnimationFrame(loop);
// Autoverificación: las placas generadas deben coincidir con la lista de partes de cada marca
for (const [id, a] of assemblies) {
  const mk = MARKS[state.assign[id]]; const c = {};
  for (const m of a.meshes) if (!m.userData.sub) c[m.userData.part] = (c[m.userData.part] || 0) + 1;
  for (const r of mk.lista) { const k = r[1].startsWith('P025SVH001') ? 'P025SVH001' : r[1]; if ((c[k] || 0) !== r[3]) console.warn(`Conteo distinto en ${id} ${state.assign[id]} ${k}: 3D ${c[k] || 0} vs lista ${r[3]}`); }
}
window.__visor = { state, ANA, POS, MARKS, assemblies, selectPos, focusPos, setView, setLevel, setTab, openSheet, camera, controls, focusPlate, exitFocus, instancesOf, shapeArea, calcKg, quickCheck, hssWallRows, focus };
</script>
